<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Гонка чата</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b1040;
    --gold: #ffd23f;
    --pink: #ff4fa3;
    --cyan: #3ee8ff;
    --lime: #7dff5a;
    --display: "Russo One", "Arial Black", Impact, sans-serif;
    --body: "Rubik", "Segoe UI", Arial, sans-serif;
    --panel: linear-gradient(180deg, rgba(64, 32, 160, .88), rgba(36, 14, 100, .88));
  }
  html, body { margin: 0; height: 100%; background: #6ec6ff; overflow: hidden; }
  #stage { width: 1080px; height: 1920px; overflow: hidden; background: #8fd3ff; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: #fff; font-family: var(--body); font-weight: 800; }

  /* «мультяшный» текст: толстая тёмная обводка + тень */
  .toon { font-family: var(--display); color: #fff; paint-order: stroke fill;
          -webkit-text-stroke: 12px var(--ink); text-shadow: 0 8px 0 var(--ink), 0 12px 18px rgba(0,0,0,.35); letter-spacing: 1px; }
  .pill { background: var(--panel); border: 5px solid #fff; border-radius: 999px; box-shadow: 0 8px 0 var(--ink), 0 14px 24px rgba(0,0,0,.25); }
  .card { background: var(--panel); border: 5px solid #fff; border-radius: 34px; box-shadow: 0 10px 0 var(--ink), 0 18px 30px rgba(0,0,0,.3); }

  #title { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font-size: 104px; line-height: 1;
           animation: bob 2.4s ease-in-out infinite; }
  #title b { color: var(--gold); font-weight: normal; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1.5deg) } 50% { transform: translateY(-8px) rotate(1.5deg) } }

  #phase { position: absolute; top: 158px; left: 50%; transform: translateX(-50%); white-space: nowrap;
           padding: 10px 36px; font-family: var(--display); font-size: 46px; }

  /* мини-карта прогресса */
  #map { position: absolute; top: 262px; left: 60px; right: 60px; height: 70px; transition: opacity .4s; }
  #map .bar { position: absolute; left: 0; right: 60px; top: 28px; height: 16px; border-radius: 8px;
              background: rgba(255,255,255,.75); border: 4px solid var(--ink); }
  #map .flag { position: absolute; right: 0; top: 4px; font-size: 54px; }
  #map .ob { position: absolute; top: 18px; font-size: 26px; transform: translateX(-50%); }
  #map .dot { position: absolute; top: 14px; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%;
              border: 4px solid var(--ink); background: var(--c); color: var(--ink); font-size: 22px; line-height: 32px;
              text-align: center; transition: left .25s linear; }
  #map .dot.lead { width: 54px; height: 54px; margin-left: -27px; top: 6px; line-height: 46px; font-size: 28px; z-index: 5;
                   box-shadow: 0 0 0 5px var(--gold); }

  #ticker { position: absolute; top: 354px; left: 50%; transform: translateX(-50%); white-space: nowrap;
            font-size: 36px; padding: 12px 34px; transition: opacity .3s; }

  #legend { position: absolute; top: 262px; left: 36px; right: 36px; padding: 22px 28px; font-size: 27px;
            display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; transition: opacity .5s, transform .5s; }
  #legend .row { display: flex; gap: 10px; align-items: center; margin: 5px 0; line-height: 1.15; }
  #legend .row .ico { width: 40px; flex: none; text-align: center; font-size: 32px; }
  #legend .row.join, #legend .row.wide { grid-column: 1 / -1; }
  #legend .row.join { font-family: var(--display); font-weight: normal; color: var(--gold); font-size: 46px;
                      justify-content: center; margin-bottom: 10px; }

  #standings { position: absolute; top: 450px; right: 24px; width: 360px; transition: opacity .4s; }
  #standings .st { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 6px 18px 6px 8px;
                   font-size: 30px; border-radius: 999px; background: var(--panel); border: 4px solid #fff;
                   box-shadow: 0 6px 0 var(--ink); }
  #standings .st .pos { font-family: var(--display); width: 46px; height: 46px; line-height: 46px; text-align: center;
                        border-radius: 50%; background: var(--c); color: var(--ink); flex: none; }
  #standings .st:first-child .pos { background: var(--gold); }
  #standings .st .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  #tags { position: absolute; inset: 0; }
  .tag { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; font-size: 32px; }
  .tag .t { display: inline-block; font-size: 22px; padding: 2px 12px; border-radius: 12px; margin-bottom: 4px;
            background: var(--tc); color: var(--ink); border: 3px solid var(--ink); }
  .tag .n { display: block; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 7px var(--ink); }
  .tag .n i { font-style: normal; color: var(--c); paint-order: stroke fill; }
  .tag.lead .n::before { content: "👑 "; }
  .tag.stun .n::after { content: " 💫"; }

  .pop { position: absolute; transform: translate(-50%, -50%); font-family: var(--display); font-size: 50px; white-space: nowrap;
         animation: pop 1.3s ease-out forwards; color: var(--c); paint-order: stroke fill; -webkit-text-stroke: 9px var(--ink); }
  @keyframes pop { 0% { opacity: 0; scale: .3 } 15% { opacity: 1; scale: 1.35 } 30% { scale: 1 } 100% { opacity: 0; translate: 0 -170px } }

  #banner { position: absolute; top: 760px; left: 0; right: 0; text-align: center; font-size: 104px; line-height: 1.05;
            padding: 0 30px; opacity: 0; }
  #banner.show { animation: banner 2.4s ease-out forwards; }
  #banner small { display: block; font-size: 56px; color: var(--gold); }
  @keyframes banner { 0% { opacity: 0; transform: scale(2.8) rotate(-8deg) } 12% { opacity: 1; transform: scale(.9) rotate(3deg) }
                      20% { transform: scale(1.06) rotate(-1deg) } 80% { opacity: 1; transform: scale(1) }
                      100% { opacity: 0; transform: scale(1.1) translateY(-60px) } }

  #countdown { position: absolute; top: 720px; left: 0; right: 0; text-align: center; font-size: 400px; opacity: 0; color: var(--gold); }
  #countdown.show { animation: count .95s ease-out forwards; }
  @keyframes count { 0% { opacity: 0; transform: scale(3) rotate(-15deg) } 20% { opacity: 1; transform: scale(1) rotate(0) }
                     100% { opacity: 0; transform: scale(.6) } }

  #feed { position: absolute; left: 30px; right: 30px; bottom: 80px; display: flex; flex-direction: column-reverse; gap: 12px;
          transition: opacity .4s; }
  #feed .f { align-self: flex-start; max-width: 100%; padding: 10px 26px 10px 18px; font-size: 32px;
             border-radius: 999px; background: var(--panel); border: 4px solid #fff; box-shadow: 0 6px 0 var(--ink);
             animation: slide .35s cubic-bezier(.2, 1.4, .4, 1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             transition: opacity .6s; }
  #feed .f::before { content: ""; display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--c);
                     margin-right: 12px; border: 3px solid var(--ink); vertical-align: -2px; }
  #feed .f.big { font-size: 40px; background: linear-gradient(180deg, #ff7ab8, #c22a7a); }
  @keyframes slide { from { transform: translateX(-120%) } to { transform: none } }

  #results { position: absolute; top: 1010px; left: 50px; right: 50px; padding: 30px 40px;
             opacity: 0; transform: scale(.8); transition: opacity .5s, transform .5s cubic-bezier(.2, 1.4, .4, 1); }
  #results.show { opacity: 1; transform: none; }
  #results h2 { margin: 0 0 18px; text-align: center; font-size: 88px; font-weight: normal; color: var(--gold); }
  #results .r { display: flex; align-items: center; gap: 22px; font-size: 48px; margin: 12px 0; }
  #results .r .m { width: 80px; text-align: center; font-size: 60px; }
  #results .r .nm { flex: 1; color: var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                    paint-order: stroke fill; -webkit-text-stroke: 6px var(--ink); }
  #results .r .tm { color: #e6e1ff; font-size: 40px; }
  #results .aura { text-align: center; margin-top: 20px; font-family: var(--display); font-size: 56px; color: #e7b6ff; }

  #auratop { position: absolute; top: 262px; left: 120px; right: 120px; padding: 22px 34px; font-size: 34px; transition: opacity .5s; }
  #auratop h3 { margin: 0 0 8px; font-family: var(--display); font-weight: normal; font-size: 42px; color: #f0c6ff; text-align: center; }
  #auratop .a { display: flex; justify-content: space-between; margin: 6px 0; }
  #auratop .a span:last-child { color: #f0c6ff; }

  #focus { position: absolute; bottom: 430px; left: 50%; transform: translateX(-50%) scale(.6); white-space: nowrap;
           max-width: 980px; overflow: hidden; text-overflow: ellipsis; padding: 14px 36px; font-family: var(--display);
           font-size: 44px; font-weight: normal; background: linear-gradient(180deg, #ffcf3f, #ff8a1a); color: var(--ink);
           opacity: 0; transition: opacity .25s, transform .25s cubic-bezier(.2, 1.6, .4, 1); }
  #focus.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #focus.pulse { animation: focuspulse .5s ease-out; }
  @keyframes focuspulse { 0% { filter: brightness(1.8) } 100% { filter: none } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #flash.go { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: var(--fa, .9) } 100% { opacity: 0 } }

  #status { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 24px; opacity: .7;
            text-shadow: 0 2px 0 var(--ink); }
  #hint { position: absolute; bottom: 470px; left: 50%; transform: translateX(-50%); padding: 18px 34px; font-size: 34px;
          display: none; pointer-events: auto; cursor: pointer; background: var(--pink); }
  .hidden { opacity: 0 !important; }

  /* ===== гонка: всё компактнее, чтобы не закрывать вид ===== */
  #title, #phase, #map { transition: top .4s, font-size .4s, padding .4s, opacity .4s; }
  #hud.racing #title { font-size: 60px; top: 18px; -webkit-text-stroke: 9px var(--ink); text-shadow: 0 5px 0 var(--ink); animation: none; }
  #hud.racing #phase { top: 92px; font-size: 30px; padding: 5px 24px; border-width: 4px; box-shadow: 0 5px 0 var(--ink); }
  #hud.racing #map { top: 150px; }
  #hud.racing #ticker { display: none; }
  #standings { top: 236px; right: 16px; width: 290px; }
  #standings .st { font-size: 24px; padding: 3px 14px 3px 5px; margin-bottom: 7px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
  #standings .st .pos { width: 34px; height: 34px; line-height: 34px; font-size: 22px; }

  /* топ-даритель эфира */
  #topgift { position: absolute; top: 236px; left: 16px; max-width: 400px; padding: 8px 20px; font-size: 22px;
             background: linear-gradient(180deg, #ffe066, #ff9a1a); color: var(--ink); border: 4px solid #fff;
             border-radius: 22px; box-shadow: 0 5px 0 var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             transition: opacity .4s; }
  #topgift b { display: block; font-family: var(--display); font-weight: normal; font-size: 30px; overflow: hidden; text-overflow: ellipsis; }
  #topgift:empty { display: none; }
  #hud:not(.racing) #topgift { display: none; }

  /* карточка подарка — её должны видеть все */
  #gift { position: absolute; top: 470px; left: 50%; width: 900px; margin-left: -450px; display: flex; align-items: center; gap: 26px;
          padding: 16px 34px; border-radius: 36px; border: 6px solid #fff; background: linear-gradient(135deg, #ff4fa3, #8a5cff);
          box-shadow: 0 10px 0 var(--ink), 0 0 40px rgba(255, 79, 163, .6); transform: translateY(-60px) scale(.6); opacity: 0;
          transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), opacity .25s; }
  #gift.show { transform: none; opacity: 1; }
  #hud:not(.racing) #gift { top: 1180px; }   /* в лобби — под бегунами, не на правилах */
  #hud.results #gift { top: 230px; }
  #gift.big { background: linear-gradient(135deg, #ffd23f, #ff5a1a); box-shadow: 0 10px 0 var(--ink), 0 0 80px rgba(255, 210, 63, .95); }
  #gift .ico { font-size: 116px; line-height: 1; animation: wob .5s ease-in-out infinite alternate; flex: none; }
  @keyframes wob { from { transform: rotate(-12deg) scale(1) } to { transform: rotate(12deg) scale(1.15) } }
  #gift .txt { min-width: 0; }
  #gift .who { font-family: var(--display); font-size: 52px; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 9px var(--ink);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gift .what { font-size: 36px; color: #fff; paint-order: stroke fill; -webkit-text-stroke: 7px var(--ink); white-space: nowrap; }
  #gift .fx { font-size: 38px; color: var(--gold); paint-order: stroke fill; -webkit-text-stroke: 7px var(--ink); white-space: nowrap; }
  #gift.big .fx { color: #fff; }

  #feed { bottom: 56px; gap: 8px; }
  #feed .f { font-size: 26px; padding: 6px 20px 6px 14px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
  #feed .f.big { font-size: 30px; }
  .tag { font-size: 26px; }
  .tag .t { font-size: 18px; padding: 1px 10px; }
  .tag .t:empty { display: none; }
  #banner { top: 760px; font-size: 90px; }
  #banner.show { animation-duration: 2s; }
  #focus { display: none; }
  #speed { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  /* золотая аура по краям экрана в момент победы */
  #aurafx { position: absolute; inset: 0; opacity: 0;
            background: radial-gradient(ellipse at center, rgba(255,210,63,0) 45%, rgba(255,190,40,.55) 85%, rgba(255,160,20,.85) 100%); }
  #aurafx.show { animation: aurafx 2.8s ease-out; }
  @keyframes aurafx { 0% { opacity: 0 } 10% { opacity: 1 } 60% { opacity: .8 } 100% { opacity: 0 } }
</style>
<script type="importmap">
  { "imports": { "three": "/web/vendor/three.module.min.js", "three/addons/": "/web/vendor/addons/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="hud">
    <canvas id="speed" width="540" height="960"></canvas>
    <div id="tags"></div>
    <div id="title" class="toon">ГОНКА <b>ЧАТА</b></div>
    <div id="phase" class="pill">Подключение…</div>
    <div id="map"><div class="bar"></div><div class="flag">🏁</div></div>
    <div id="ticker" class="pill"></div>
    <div id="legend" class="card"></div>
    <div id="standings"></div>
    <div id="auratop" class="card"></div>
    <div id="results" class="card"></div>
    <div id="focus" class="pill"></div>
    <div id="gift"><div class="ico"></div><div class="txt"><div class="who"></div><div class="what"></div><div class="fx"></div></div></div>
    <div id="topgift"></div>
    <div id="banner" class="toon"></div>
    <div id="countdown" class="toon"></div>
    <div id="feed"></div>
    <div id="aurafx"></div>
    <div id="flash"></div>
    <div id="status"></div>
    <div id="hint" class="pill">🔊 Нажми, чтобы включить звук</div>
  </div>
</div>
<script type="module" src="/web/game.js"></script>
</body>
</html>
